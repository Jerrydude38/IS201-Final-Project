<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightsaber Duel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;

            background-image: url('../assets/img/fightbackground.jpg')  ;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .game-container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 36px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin-top: 20px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .cell:hover {
            background-color: #d3d3d3;
        }

        .reset-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .reset-btn:hover {
            background-color: #45a049;
        }

        .status {
            font-size: 18px;
            margin-top: 20px;
        }

        .winner {
            font-weight: bold;
            color: green;
        }

        .draw {
            color: orange;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Lightsaber Duel</h1>
    <div class="status">Rebel's turn</div>
    <div class="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <button class="reset-btn">Restart Game</button>
</div>

<script>
    const cells = document.querySelectorAll('.cell');
    const status = document.querySelector('.status');
    const resetBtn = document.querySelector('.reset-btn');

    let currentPlayer = 'Rebels';  // First player is Rebels
    let nextPlayer = 'Empire';     // Second player is Empire
    let board = ['', '', '', '', '', '', '', '', ''];
    let gameOver = false;

    // Game logic
    const checkWinner = () => {
        const winPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        for (let pattern of winPatterns) {
            const [a, b, c] = pattern;
            if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                gameOver = true;
                status.textContent = `${currentPlayer} win!`;
                status.classList.add('winner');
                return;
            }
        }

        if (!board.includes('')) {
            gameOver = true;
            status.textContent = "It's a draw!";
            status.classList.add('draw');
        }
    };

    const handleClick = (e) => {
        const index = e.target.dataset.index;

        if (gameOver || board[index]) return; // Prevent making a move after game is over

        board[index] = currentPlayer;
        const img = document.createElement('img');
        img.src = currentPlayer === 'Rebels' ? '../assets/img/blue.png' : '../assets/img/red.png'; 
        img.alt = currentPlayer;
        img.style.width = '80%';
        img.style.height = '80%';
        e.target.appendChild(img);

        checkWinner();

        if (!gameOver) {
            // Swap players
            [currentPlayer, nextPlayer] = [nextPlayer, currentPlayer];
            status.textContent = `${currentPlayer}'s turn`;
        }
    };

    const resetGame = () => {
        board = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'Rebels';
        nextPlayer = 'Empire';
        gameOver = false;
        status.textContent = `${currentPlayer}'s turn`;
        status.classList.remove('winner', 'draw');
        cells.forEach(cell => {
            cell.textContent = '';
            cell.innerHTML = ''; // Clear any image in the cell
        });
    };

    // Add event listeners
    cells.forEach(cell => cell.addEventListener('click', handleClick));
    resetBtn.addEventListener('click', resetGame);
</script>

</body>
</html>
